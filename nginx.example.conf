# Nginx Configuration for SPA (Single Page Application)
# Copy this configuration to your nginx server block

server {
    listen 80;
    server_name your-domain.com;  # Replace with your actual domain

    root /var/www/antika-factory/dist;  # Replace with your actual path
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Cache Control for Static Assets
    location ~* \.(js|css|png|jpg|jpeg|gif|webp|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA Fallback - All requests go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # robots.txt and sitemap.xml
    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        allow all;
        log_not_found off;
        access_log off;
    }

    # Deny access to admin routes (if any)
    location /admin/ {
        deny all;
    }
}
