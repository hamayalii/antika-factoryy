# Cloudflare Edge Caching Configuration
# Target: TTFB < 100ms through global edge network
# Expected: 70-85% reduction in latency for non-US regions

# Cache Level: Aggressive edge caching
# Cache Everything strategy for static assets
# Mathematical: 90% cache hit rate at edge reduces average latency by 75-85%

# Cache Rules (apply in Cloudflare Dashboard or via API)
# Rule 1: Static assets - Cache everything for 1 year
zone = "antika-factory.com"

[cache.static_assets]
  match = ["*.js", "*.css", "*.woff2", "*.woff", "*.ttf", "*.otf", "*.eot"]
  cache_level = "cache_everything"
  edge_ttl = 31536000
  browser_ttl = 31536000
  cache_key = ["scheme", "host", "uri"]
  respect_strong_etags = true

# Rule 2: Images - Cache with stale-while-revalidate
[cache.images]
  match = ["*.jpg", "*.jpeg", "*.png", "*.gif", "*.webp", "*.avif", "*.ico", "*.svg"]
  cache_level = "ignore_query_string"
  edge_ttl = 15552000
  browser_ttl = 15552000
  stale_while_revalidate = 86400
  stale_if_error = 604800
  cache_key = ["scheme", "host", "uri"]

# Rule 3: HTML - Cache with short revalidation
[cache.html]
  match = ["*.html"]
  cache_level = "standard"
  edge_ttl = 600
  browser_ttl = 300
  stale_while_revalidate = 30
  bypass_cache_on_cookie = false

# Page Rules (via Cloudflare API)
[[page_rules]]
  pattern = "https://antika-factory.com/*.{js,css,woff2,woff,ttf,otf}"
  settings = [
    { id = "cache_level", value = "cache_everything" },
    { id = "edge_cache_ttl", value = "31536000" },
    { id = "browser_cache_ttl", value = "31536000" },
    { id = "explicit_cache_control", value: "on" }
  ]

[[page_rules]]
  pattern = "https://antika-factory.com/*.{jpg,jpeg,png,gif,webp,avif,ico,svg}"
  settings = [
    { id = "cache_level", value = "ignore_query_string" },
    { id = "edge_cache_ttl", value = "15552000" },
    { id = "browser_cache_ttl", value = "15552000" },
    { id = "cache_by_device_type", value: "on" }
  ]

# HTTP/3 (QUIC) Configuration
# Eliminates TCP Head-of-Line blocking: 15-30% latency reduction on lossy networks
[settings.http3]
  enabled = true
  h2_prior_knowledge = false

# Brotli Compression
# Brotli level 11: 15-25% better compression than gzip
[settings.compression]
  brotli = true
  brotli_level = 11
  gzip = true
  gzip_level = 6

# TLS 1.3 Only (for minimum handshake latency)
# TLS 1.3 0-RTT: ~30-40ms faster than TLS 1.2
[settings.tls]
  min_tls_version = "1.3"
  tls_1_3 = "on"
  opportunistic_encryption = "on"

# Automatic HTTPS Rewrites
[settings.https]
  always_use_https = true
  automatic_https_rewrites = true
  hsts = "max-age=63072000; includeSubDomains; preload"

# Security Headers
[settings.security]
  ssl = "strict"
  security_level = "high"
  hotlink_protection = "on"

# Rate Limiting (prevent DDoS impact on TTFB)
[settings.rate_limit]
  enabled = true
  rate_limit = 1000
  period = 60

# Argon Smart Routing (smart routing to nearest data center)
[settings.smart_routing]
  enabled = true

# Mirage (image optimization at edge)
[settings.mirage]
  enabled = true
  mirage_strip_cookies = true

# Rocket Loader DISABLED - breaks React hydration determinism
# Causes Uncanny Valley: UI visible but unresponsive
[settings.rocket_loader]
  enabled = false

# Polish (WebP/AVIF conversion at edge)
# Expected: 50-70% image size reduction
[settings.polish]
  enabled = true
  level = "lossless"
  webp = true
  avif = true

# Mobile Redirect (optimize for mobile)
[settings.mobile_redirect]
  enabled = false

# Browser Cache TTL override
[settings.browser_cache_ttl]
  override = true
  value = 31536000

# Query String Sort (improve cache hit rate)
[settings.query_string_sort]
  enabled = true

# Always Online (serve from cache during origin downtime)
[settings.always_online]
  enabled = true
  only_if_cold = false
