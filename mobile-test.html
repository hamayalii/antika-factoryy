<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; padding: 20px; }
        .viewport {
            border: 2px solid #333;
            margin-bottom: 20px;
            padding: 10px;
            background: #f5f5f5;
        }
        .viewport-label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        iframe {
            width: 100%;
            border: 1px solid #ccc;
            background: white;
        }
    </style>
</head>
<body>
    <h1>Mobile Viewport Test</h1>
    <p>Testing hero section at different mobile widths</p>
    
    <div class="viewport">
        <div class="viewport-label">360px width (iPhone SE)</div>
        <iframe src="http://localhost:5175" style="height: 600px;" width="360"></iframe>
    </div>
    
    <div class="viewport">
        <div class="viewport-label">390px width (iPhone 12/13/14)</div>
        <iframe src="http://localhost:5175" style="height: 600px;" width="390"></iframe>
    </div>
    
    <div class="viewport">
        <div class="viewport-label">414px width (iPhone 14 Pro Max)</div>
        <iframe src="http://localhost:5175" style="height: 600px;" width="414"></iframe>
    </div>
</body>
</html>
